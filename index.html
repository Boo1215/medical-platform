<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学知识管理平台 - 原型入口</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(135deg,#eef2ff,#f8fafc); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { max-width:760px; width:100%; }
  h1 { font-size:28px; color:#1e293b; text-align:center; margin-bottom:8px; }
  .sub { font-size:14px; color:#64748b; text-align:center; margin-bottom:36px; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:640px){ .cards{ grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:28px; text-decoration:none; transition:.18s; display:block; }
  .card:hover { box-shadow:0 8px 28px rgba(0,0,0,.1); transform:translateY(-3px); border-color:#3b82f6; }
  .icon { width:52px; height:52px; border-radius:12px; background:#eff6ff; color:#3b82f6; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:16px; }
  .icon.purple { background:#f5f3ff; color:#8b5cf6; }
  .name { font-size:18px; font-weight:700; color:#1e293b; margin-bottom:6px; }
  .desc { font-size:13px; color:#64748b; line-height:1.6; }
  .go { margin-top:16px; font-size:14px; color:#3b82f6; font-weight:600; }
  .foot { text-align:center; margin-top:32px; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>医学知识管理平台</h1>
    <div class="sub">高保真交互原型 · 请选择要查看的版本</div>
    <div class="cards">
      <a class="card" href="full.html">
        <div class="icon">&#9636;</div>
        <div class="name">完整版</div>
        <div class="desc">包含知识库管理、加工引擎、目标模型、智能检索、产品知识、权限管理等全部模块。</div>
        <div class="go">进入 &rarr;</div>
      </a>
      <a class="card" href="skill.html">
        <div class="icon purple">&#129302;</div>
        <div class="name">Skill 及智能体版</div>
        <div class="desc">在完整版基础上，增加「Skill 市场」与「智能体中心」，演示算子/Pipeline 封装为能力。</div>
        <div class="go">进入 &rarr;</div>
      </a>
    </div>
    <div class="foot">原型演示版本 · 数据为示例数据</div>
  </div>
</body>
</html>
